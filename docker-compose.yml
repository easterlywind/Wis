version: "3.8"

services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: smile-sprout-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autismsupport
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── NestJS Backend ──
  backend:
    build:
      context: ./support-autism-children-be
      dockerfile: Dockerfile
    container_name: smile-sprout-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/autismsupport"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: "3000"
      CORS_ORIGIN: "http://localhost:8080"
    ports:
      - "3000:3000"
    volumes:
      - backend_media_drawing:/app/media_drawing

  # ── React Frontend ──
  frontend:
    build:
      context: ./smile-sprout
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000/api
        - VITE_AI_API_URL=http://localhost:8000
    container_name: smile-sprout-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"

  # ── AI Services ──
  ai-emotrack:
    build:
      context: ./smile-sprout/AI/backend-emotrack
      dockerfile: Dockerfile
    container_name: smile-sprout-ai-emotrack
    restart: unless-stopped
    ports:
      - "8502:8000"
    volumes:
      - ./smile-sprout/AI/backend-emotrack/data:/app/data

  ai-mapping:
    build:
      context: ./smile-sprout/AI/backend-mapping
      dockerfile: Dockerfile
    container_name: smile-sprout-ai-mapping
    restart: unless-stopped
    depends_on:
      - ai-emotrack
    environment:
      EMOTRACK_URL: "http://ai-emotrack:8000/detect-emotion"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  backend_media_drawing:
